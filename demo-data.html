<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Демо данные - SteakHouse</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .demo-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
    button { background: #d4af37; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
    button:hover { background: #c49a27; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; max-height: 200px; }
  </style>
</head>
<body>
  <h1>Демо данные для тестирования SteakHouse</h1>

  <div class="demo-section">
    <h2>Создать тестового пользователя</h2>
    <button onclick="createTestUser()">Создать пользователя</button>
    <div id="userResult"></div>
  </div>

  <div class="demo-section">
    <h2>Создать тестовые заказы</h2>
    <button onclick="createTestOrders()">Создать заказы</button>
    <div id="ordersResult"></div>
  </div>

  <div class="demo-section">
    <h2>Тестирование страниц</h2>
    <button onclick="openLogin()">Открыть вход</button>
    <button onclick="openAccount()">Открыть аккаунт</button>
    <button onclick="openAdmin()">Открыть админку</button>
  </div>

  <script>
    function createTestUser() {
      const userData = {
        name: "Иван Петров",
        firstName: "Иван",
        lastName: "Петров",
        email: "ivan.petrov@email.com",
        phone: "+7 (777) 123-45-67",
        birthDate: "1990-05-15",
        city: "Астана",
        address: "пр. Победы, 45",
        apartment: "кв. 123",
        entrance: "2",
        isLoggedIn: true,
        registrationTime: new Date().toISOString()
      };

      localStorage.setItem('userData', JSON.stringify(userData));
      document.getElementById('userResult').innerHTML = '<pre>' + JSON.stringify(userData, null, 2) + '</pre>';
      alert('Тестовый пользователь создан!');
    }

    function createTestOrders() {
      const orders = [
        {
          id: 1001,
          date: new Date(Date.now() - 86400000).toISOString(), // 1 день назад
          status: 'completed',
          total: 22800,
          items: [
            { name: 'Ribeye Prime', price: 8900, quantity: 1 },
            { name: 'Tomahawk', price: 13900, quantity: 1 }
          ]
        },
        {
          id: 1002,
          date: new Date(Date.now() - 172800000).toISOString(), // 2 дня назад
          status: 'completed',
          total: 7500,
          items: [
            { name: 'Striploin Premium', price: 7500, quantity: 1 }
          ]
        },
        {
          id: 1003,
          date: new Date().toISOString(), // сегодня
          status: 'pending',
          total: 17000,
          items: [
            { name: 'Striploin Premium', price: 7500, quantity: 1 },
            { name: 'T-Bone Classic', price: 9500, quantity: 1 }
          ]
        }
      ];

      localStorage.setItem('userOrders', JSON.stringify(orders));
      document.getElementById('ordersResult').innerHTML = '<pre>' + JSON.stringify(orders, null, 2) + '</pre>';
      alert('Тестовые заказы созданы!');
    }

    function openLogin() {
      window.open('login.html', '_blank');
    }

    function openAccount() {
      window.open('account-new.html', '_blank');
    }

    function openAdmin() {
      window.open('admin-login.html', '_blank');
    }
  </script>
</body>
</html>
