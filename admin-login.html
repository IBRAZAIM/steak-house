<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход в админ-панель - PREMIUM STEAK HOUSE</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="admin-login-page">
    <div class="admin-login-container">
      <div class="admin-login-logo">
        <h1>PREMIUM <span>STEAK HOUSE</span></h1>
        <p>Админ-панель</p>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Логин</label>
          <input type="text" id="username" name="username" placeholder="Введите логин" required />
        </div>
        
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" placeholder="Введите пароль" required />
        </div>
        
        <div class="login-error" id="loginError">
          Неверный логин или пароль
        </div>
        
        <button type="submit" class="btn-admin">
          <i class="fas fa-sign-in-alt"></i> Войти
        </button>
      </form>
      
      <div style="text-align: center; margin-top: 20px;">
        <a href="index.html" style="color: #666; text-decoration: none; font-size: 14px;">
          <i class="fas fa-arrow-left"></i> Вернуться на сайт
        </a>
      </div>
    </div>
  </div>

  <script>
    // Check if already logged in
    if (localStorage.getItem('adminLoggedIn') === 'true') {
      window.location.href = 'admin-new.html';
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      // Admin credentials (hardcoded for simplicity)
      // In production, this should be handled server-side
      const adminCredentials = {
        username: 'admin',
        password: 'steakhouse2024'
      };
      
      if (username === adminCredentials.username && password === adminCredentials.password) {
        // Set admin session
        localStorage.setItem('adminLoggedIn', 'true');
        localStorage.setItem('adminUsername', username);
        
        // Redirect to admin panel
        window.location.href = 'admin-new.html';
      } else {
        // Show error
        document.getElementById('loginError').style.display = 'block';
        
        // Shake animation
        const container = document.querySelector('.admin-login-container');
        container.style.animation = 'shake 0.5s';
        setTimeout(() => {
          container.style.animation = '';
        }, 500);
      }
    });

    // Add shake animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
